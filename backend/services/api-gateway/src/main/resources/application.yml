server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  servlet:
    multipart:
      max-file-size: ${FILE_UPLOAD_MAX_SIZE:100MB}
      max-request-size: ${FILE_UPLOAD_MAX_SIZE:100MB}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        cluster-name: ${NACOS_CLUSTER:DEFAULT}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agent_service_db}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:hydro}
    password: ${DB_PASSWORD:hydro123}
    driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  agent-service-name: ${AGENT_SERVICE_NAME:agent-service}
  case-service-name: ${CASE_SERVICE_NAME:case-service}
  file-service-name: ${FILE_SERVICE_NAME:file-service}
  auth-token-secret: ${AUTH_TOKEN_SECRET:hydroguardian-dev-secret}
  file-upload:
    max-bytes: ${FILE_UPLOAD_MAX_BYTES:104857600}
    grpc-max-inbound-message-bytes: ${FILE_UPLOAD_GRPC_MAX_INBOUND_MESSAGE_BYTES:104857600}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
