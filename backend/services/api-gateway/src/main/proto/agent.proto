syntax = "proto3";

package hydro.agent.v1;

option java_multiple_files = true;
option java_package = "com.hydro.grpc.agentv1";
option java_outer_classname = "AgentProto";

// agent-service 对外暴露的智能体执行、场景预处理与文件查询 gRPC 契约。
service AgentRpcService {
  rpc ExecuteTask (ExecuteTaskRequest) returns (ExecuteTaskReply);
  rpc PreprocessScene (PreprocessSceneRequest) returns (PreprocessSceneReply);
  rpc UploadFile (UploadFileRequest) returns (QueryFileReply);
  rpc QueryFile (QueryFileRequest) returns (QueryFileReply);
}

// 执行巡查任务所需的最小输入，debug 用于控制是否返回完整 trace。
message ExecuteTaskRequest {
  string task_text = 1;
  string scene_id = 2;
  bool debug = 3;
}

// 智能体执行结果摘要，包含风险结果、case 落库状态和诊断信息。
message ExecuteTaskReply {
  string task_text = 1;
  string scene_id = 2;
  string target_type = 3;
  double risk_score = 4;
  string risk_level = 5;
  string recommendation_action = 6;
  string case_id = 7;
  string case_status = 8;
  string execution_status = 9;
  string parser_source = 10;
  string evidence_status = 11;
  bool review_required = 12;
  repeated AgentTraceItem trace = 13;
  repeated AgentErrorItem errors = 14;
  // 使用 trace_total 避免 Java 生成代码与 repeated trace 的 getTraceCount() 冲突。
  int32 trace_total = 15;
  int32 error_count = 16;
  string case_persistence_status = 17;
  string case_persistence_error = 18;
}

// 真实场景预处理请求；前端上传原始资产后，把 fileId 交给 agent-service 生成 SceneTensorSample。
message PreprocessSceneRequest {
  string scene_id = 1;
  string sample_id = 2;
  string image_file_id = 3;
  string point_cloud_file_id = 4;
  string pre_image_file_id = 5;
  string post_image_file_id = 6;
  string preprocess_version = 7;
  int32 image_size = 8;
  int32 max_points = 9;
}

// 真实场景预处理响应；scene_sample_file_id 是生成并上传到 file-service 的样本 JSON。
message PreprocessSceneReply {
  string scene_id = 1;
  string sample_id = 2;
  string scene_sample_file_id = 3;
  string image_file_id = 4;
  string point_cloud_file_id = 5;
  string pre_image_file_id = 6;
  string post_image_file_id = 7;
  string preprocess_version = 8;
  bool manifest_registered = 9;
  string checksum_sha256 = 10;
  string scene_sample_file_name = 11;
  string status = 12;
}

// 单条链路追踪事件，data_json 保存结构化诊断信息。
message AgentTraceItem {
  string stage = 1;
  string message = 2;
  string data_json = 3;
}

// 单条错误事件，保持和 trace 一致的字段形态便于前端渲染。
message AgentErrorItem {
  string stage = 1;
  string message = 2;
  string data_json = 3;
}

// 文件查询请求。
message QueryFileRequest {
  string file_id = 1;
}

// 文件上传请求。
message UploadFileRequest {
  string file_name = 1;
  string content_type = 2;
  bytes content = 3;
}

// 文件元数据响应。
message QueryFileReply {
  string file_id = 1;
  string file_name = 2;
  string content_type = 3;
  int64 size = 4;
  string download_url = 5;
  string object_key = 6;
  string file_type = 7;
  string checksum_sha256 = 8;
}
