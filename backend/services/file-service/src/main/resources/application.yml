server:
  port: ${SERVER_PORT:0}

spring:
  main:
    keep-alive: true
  application:
    name: file-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        cluster-name: ${NACOS_CLUSTER:DEFAULT}
        port: ${GRPC_SERVER_PORT:9093}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:file_service_db}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:hydro}
    password: ${DB_PASSWORD:hydro123}
    driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  minio:
    endpoint: http://${MINIO_ENDPOINT:localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:hydro}
    secret-key: ${MINIO_SECRET_KEY:hydro12345}
    bucket: ${MINIO_BUCKET:hydro-files}
    presigned-expiry-seconds: ${MINIO_PRESIGNED_EXPIRY_SECONDS:604800}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9093}
    max-inbound-message-bytes: ${GRPC_MAX_INBOUND_MESSAGE_BYTES:104857600}
