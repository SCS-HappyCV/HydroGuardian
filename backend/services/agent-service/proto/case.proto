syntax = "proto3";

package hydro.case.v1;

// case-service 暴露给 agent-service 的 case 与场景资产清单契约。
service CaseRpcService {
  rpc CreateCase (CreateCaseRequest) returns (CaseReply);
  rpc GetCase (GetCaseRequest) returns (CaseReply);
  rpc UpdateCaseAgentResult (UpdateCaseAgentResultRequest) returns (CaseReply);
  rpc CreateSceneManifest (CreateSceneManifestRequest) returns (SceneManifestReply);
  rpc GetSceneManifest (GetSceneManifestRequest) returns (SceneManifestReply);
  rpc CreateWorkOrder (CreateWorkOrderRequest) returns (WorkOrderReply);
  rpc GetWorkOrder (GetWorkOrderRequest) returns (WorkOrderReply);
  rpc ListCaseWorkOrders (ListCaseWorkOrdersRequest) returns (ListCaseWorkOrdersReply);
  rpc UpdateWorkOrderStatus (UpdateWorkOrderStatusRequest) returns (WorkOrderReply);
}

// 创建风险 case 的请求；agent_result_json 保存完整智能体执行快照。
message CreateCaseRequest {
  string title = 1;
  string task_text = 2;
  string scene_id = 3;
  string risk_level = 4;
  string assignee = 5;
  string tags = 6;
  string agent_result_json = 7;
}

// 查询单个风险 case 的请求。
message GetCaseRequest {
  string case_id = 1;
}

// 风险 case 响应；agent_result_json 从 case_agent_result 表读取。
message CaseReply {
  string case_id = 1;
  string title = 2;
  string task_text = 3;
  string scene_id = 4;
  string status = 5;
  string risk_level = 6;
  string assignee = 7;
  string tags = 8;
  string created_at = 9;
  string agent_result_json = 10;
}

// 回写智能体完整快照；用于工单创建后把真实 work_order_id 更新进 case_agent_result。
message UpdateCaseAgentResultRequest {
  string case_id = 1;
  string agent_result_json = 2;
}

// 创建或更新场景资产清单；scene_sample_file_id 指向预处理后的 SceneTensorSample JSON。
message CreateSceneManifestRequest {
  string scene_id = 1;
  string sample_id = 2;
  string scene_sample_file_id = 3;
  string image_file_id = 4;
  string point_cloud_file_id = 5;
  string pre_image_file_id = 6;
  string post_image_file_id = 7;
  string preprocess_version = 8;
  string checksum_sha256 = 9;
  string schema_version = 10;
}

// 按 scene_id 查询场景资产清单。
message GetSceneManifestRequest {
  string scene_id = 1;
}

// 场景资产清单响应；字段命名对齐 agent-service 的 manifest 读取逻辑。
message SceneManifestReply {
  string scene_id = 1;
  string sample_id = 2;
  string scene_sample_file_id = 3;
  string image_file_id = 4;
  string point_cloud_file_id = 5;
  string pre_image_file_id = 6;
  string post_image_file_id = 7;
  string preprocess_version = 8;
  string checksum_sha256 = 9;
  string created_at = 10;
  string updated_at = 11;
  string schema_version = 12;
}

// 创建工单请求；agent-service 会在 case 落库后调用它生成真实 work_order_id。
message CreateWorkOrderRequest {
  string case_id = 1;
  string risk_card_id = 2;
  string risk_type = 3;
  string risk_level = 4;
  string title = 5;
  string summary = 6;
  string recommended_action = 7;
  string assignee = 8;
  string status = 9;
  string deadline = 10;
  string evidence_summary_json = 11;
  string schema_version = 12;
}

// 查询单个工单请求。
message GetWorkOrderRequest {
  string work_order_id = 1;
}

// 按 case_id 查询工单列表请求。
message ListCaseWorkOrdersRequest {
  string case_id = 1;
}

// 更新工单状态请求；assignee 和 closure_note 为空时保持原值。
message UpdateWorkOrderStatusRequest {
  string work_order_id = 1;
  string status = 2;
  string assignee = 3;
  string closure_note = 4;
}

// 工单响应；字段直接对齐 case_work_order 表。
message WorkOrderReply {
  string work_order_id = 1;
  string case_id = 2;
  string risk_card_id = 3;
  string risk_type = 4;
  string risk_level = 5;
  string title = 6;
  string summary = 7;
  string recommended_action = 8;
  string status = 9;
  string assignee = 10;
  string deadline = 11;
  string closure_note = 12;
  string evidence_summary_json = 13;
  string schema_version = 14;
  string created_at = 15;
  string updated_at = 16;
}

// 按 case 查询工单列表响应。
message ListCaseWorkOrdersReply {
  repeated WorkOrderReply work_orders = 1;
}
