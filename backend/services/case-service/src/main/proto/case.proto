syntax = "proto3";

package hydro.case.v1;

option java_multiple_files = true;
option java_package = "com.hydro.grpc.casev1";
option java_outer_classname = "CaseProto";

// case-service 的 case 与用户鉴权 gRPC 契约。
service CaseRpcService {
  rpc CreateCase (CreateCaseRequest) returns (CaseReply);
  rpc GetCase (GetCaseRequest) returns (CaseReply);
  rpc RegisterUser (RegisterUserRequest) returns (RegisterUserReply);
  rpc LoginUser (LoginUserRequest) returns (LoginUserReply);
}

// 创建风险 case 的请求；agent_result_json 保存完整智能体执行快照。
message CreateCaseRequest {
  string title = 1;
  string task_text = 2;
  string scene_id = 3;
  string risk_level = 4;
  string assignee = 5;
  string tags = 6;
  string agent_result_json = 7;
}

// 查询单个风险 case 的请求。
message GetCaseRequest {
  string case_id = 1;
}

// 风险 case 响应；agent_result_json 从 case_agent_result 表读取。
message CaseReply {
  string case_id = 1;
  string title = 2;
  string task_text = 3;
  string scene_id = 4;
  string status = 5;
  string risk_level = 6;
  string assignee = 7;
  string tags = 8;
  string created_at = 9;
  string agent_result_json = 10;
}

// 注册用户请求。
message RegisterUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
  string confirm_password = 4;
  bool agree_terms = 5;
}

// 注册用户响应。
message RegisterUserReply {
  string user_id = 1;
  string email = 2;
  string created_at = 3;
}

// 登录用户请求。
message LoginUserRequest {
  string email = 1;
  string password = 2;
  bool remember_me = 3;
}

// 登录成功后返回给网关的用户摘要。
message AuthUser {
  string id = 1;
  string name = 2;
  string email = 3;
  string role = 4;
  string department = 5;
  string avatar_url = 6;
}

// 登录用户响应。
message LoginUserReply {
  string token_subject = 1;
  int64 expires_in = 2;
  AuthUser user = 3;
}
