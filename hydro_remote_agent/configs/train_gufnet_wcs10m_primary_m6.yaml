format_version: 1

model_params:
  model_architecture: arch_acmf
  input_dims: 6
  spatial_shape: [23088, 73472, 880]
  scale_list: [2, 4, 8, 16]
  hiden_size: 64
  num_classes: 16
  backbone_2d: FastSCNN
  pretrained2d: false
  use_LGC: false
  fusion_type: concat
  use_zmap: false
  baseline_only: true

dataset_params:
  training_size: 1145
  dataset_type: point_only_dataset_wcs2d3d
  pc_dataset_type: WCS2D3D
  collate_type: collate_fn_default
  ignore_label: 0
  label_mapping: /workspace/HydroGuardian/hydro_remote_agent/vendor/gufnet/config/label_mapping/wcs2d3d.yaml
  split_manifests:
    train: /data/wcs10m/splits/wcs10m_primary/train.jsonl
    val: /data/wcs10m/splits/wcs10m_primary/val.jsonl
    test: /data/wcs10m/splits/wcs10m_primary/test.jsonl
  expected_split_counts:
    train: 1145
    val: 246
    test: 245
  bottom_crop: [960, 960]
  color_jitter: [0.4, 0.4, 0.4]
  flip2d: 0.5
  image_normalizer:
    - [0.485, 0.456, 0.406]
    - [0.229, 0.224, 0.225]
  max_volume_space: [1116, 13082, 129]
  min_volume_space: [-4654, -5286, -88]
  seg_labelweights: [1, 6641631, 4691059, 8006269, 1121052, 2982184, 753654, 2685192, 22043635, 24535686, 2335021, 28164770, 14242784, 24088868, 4021854, 6118908]
  train_data_loader:
    data_path: /workspace/HydroGuardian/runs/hydro_remote_agent/expert_replacement_v1/m6_gufnet_primary/preprocessed
    batch_size: 8
    shuffle: true
    num_workers: 4
    rotate_aug: true
    flip_aug: true
    scale_aug: true
    transform_aug: true
    dropout_aug: true
  val_data_loader:
    data_path: /workspace/HydroGuardian/runs/hydro_remote_agent/expert_replacement_v1/m6_gufnet_primary/preprocessed
    batch_size: 8
    shuffle: false
    num_workers: 4
    rotate_aug: false
    flip_aug: false
    scale_aug: false
    transform_aug: false
    dropout_aug: false

train_params:
  max_num_epochs: 220
  learning_rate: 0.18
  optimizer: SGD
  lr_scheduler: CosineAnnealingWarmRestarts
  momentum: 0.9
  nesterov: true
  weight_decay: 1.0e-4
  lambda_seg2d: 1.0
  lambda_xm: 0.05
