# Config format schema number
format_version: 1

###################
## Model options
model_params:
  model_architecture: "arch_acmf" # 可选: "swin3d_2dpass_adapter" 使用Swin3D作为3D分支

  input_dims: 6 # xyz + rgb (label被分离出来，不包含在输入特征中)
  spatial_shape:
    - 23088
    - 73472
    - 880
  scale_list:
    - 2
    - 4
    - 8
    - 16

  hiden_size: 64
  num_classes: 16 # 16维输出：index 0 不用，1~15 对应 15 个类别
  backbone_2d: FastSCNN
  #backbone_2d: resnet34
  pretrained2d: False
  use_LGC: True # 使用LGC模块（完整模型）
  use_strip_pooling: True # 启用方向感知的条形池化 (Strip Pooling)

  fusion_type: "acmf_cmf4" # 融合主模式：启用 4-scale 渐进式 Cross-Mamba 交互 + ACMF(PUAF) 最终仲裁融合
  cmf_bits: 10 # Hilbert 序列化位宽（坐标量化精度）；越大空间排序更细但对噪声更敏感
  cmf_d_state: 16 # Mamba/SSM 状态维度；越大长程建模能力更强、显存与计算也更高
  cmf_d_conv: 4 # Mamba 内部局部卷积核宽度；控制局部上下文混合范围
  cmf_expand: 2 # Mamba 通道扩展倍率；影响表达能力与计算开销
  cmf_geo_scale_mode: "residual" # 几何条件化作用位置：'residual' 调制残差更新；'gate' 调制门控强度
  cmf_ctx_detach: False # 渐进上下文 prev_ctx 是否在尺度间断梯度；True 可省显存，False 保持端到端反传
  cmf_use_uncertainty_gated: True # 是否启用不确定性门控交互（可靠度抑制坏模态跨模态污染）
  cmf_use_geo_conditioned: True # 是否启用几何条件化交互（HA 区域增强交互、LA 区域减弱）
  cmf_geo_mode: "coord" # 几何条件来源：'coord' 用坐标 proxy；'dem' 用 DEM 梯度字段；'A' 用歧义度 A_i 字段
  cmf_uncertainty_detach: True # 不确定性 reliability 是否断梯度；True 更稳定，False 允许与主干联合学习
  use_zmap: True # 是否使用 z-map / 高程图像分量作为 2D 输入的一部分
  use_gata: True # 是否启用 GATA 几何-纹理适配模块（2D 分支前处理）
  g3d_channels: 7 # G3D 几何图通道数 (nx,ny,nz,curvature,z_norm,grad_x,grad_y)
  gata_out_channels: 32 # GATA 输出特征通道数
  g3d_knn_k: 20 # G3D 法向/曲率估计的 KNN 邻域大小
  gata_mode: 'full'   # 消融：偏移由 RGB 自身预测，无几何引导
  gata_offset_distil: True    # standard_dcn 模式下 teacher 蒸馏无意义，强制关闭

  # PUAF 混合不确定性（Aleatoric + Epistemic）超参
  puaf_enable_epistemic: True # 是否启用 epistemic（MC Dropout）不确定性；False 则退化为仅 aleatoric
  puaf_mc_samples: 4 # MC Dropout 采样次数 T；越大估计越稳但训练时间线性增长
  puaf_dropout_p: 0.2 # UQ head 内部 MC Dropout 概率；仅作用于不确定性分支，不影响主干
  puaf_lambda_e: 1.0 # epistemic 权重系数 λ_e；u = u_a + λ_e · u_e
  puaf_epistemic_in_eval: False # eval 模式下是否仍执行 MC 采样；False 保证推理确定性与速度

#  fusion_type: 'acmf'    # 完整模型
# fusion_type: 'add'    # 消融实验：直接相加融合

###################
## Dataset options
dataset_params:
  training_size: 2220 # 根据你的训练集大小修改
  dataset_type: "point_image_dataset_wcs2d3d" # 你的自定义Dataset类名
  Wandb_Project: "GAUFNet_WCS2D3D"
  pc_dataset_type: "WCS2D3D" # 你的点云数据集类名
  collate_type: "collate_fn_default"
  ignore_label: 0 # index 0 不使用，作为占位符
  label_mapping: "config/label_mapping/wcs2d3d.yaml" # 标签映射文件

  # 2D augmentation (如果不用图像可以注释掉)
  bottom_crop:
    - 960
    - 960

  color_jitter:
    - 0.4
    - 0.4
    - 0.4
  flip2d: 0.5
  image_normalizer:
    - [0.485, 0.456, 0.406]
    - [0.229, 0.224, 0.225]

  # 局部相对坐标范围（已在加载时减去中心点）
  # 基于实测统计：x∈[-113, 92], y∈[-115, 153], z∈[-69, 111]
  # 留 10% 余量，体素分辨率约 0.25×0.32×1.09 米
  max_volume_space:
    - 1116
    - 13082
    - 129
  min_volume_space:
    - -4654
    - -5286
    - -88

  # 根据15个类别修改权重（标签1~15，权重索引也是1~15）
  # index 0 的权重设为 1（不参与训练，但需要占位避免维度不匹配）
  seg_labelweights:
    - 0
    - 6641631 # index 1: Shed
    - 4691059 # index 2: Concretehouse
    - 8006269 # index 3: Cementroad
    - 1121052 # index 4: Dirtroad
    - 2982184 # index 5: Slope
    - 753654 # index 6: Scarp
    - 2685192 # index 7: Dam
    - 22043635 # index 8: Vegetablefield
    - 24535686 # index 9: Grassland
    - 2335021 # index 10: Dryland
    - 28164770 # index 11: Woodland
    - 14242784 # index 12: Bareland
    - 24088868 # index 13: Waterline
    - 4021854 # index 14: Ditch
    - 6118908 # index 15: Others

  train_data_loader:
    data_path: "/data/wcs2d3d/sequences/" # 你的训练数据路径
    batch_size: 12 # 降低batch_size以减少内存使用，提高训练稳定性
    shuffle: True
    num_workers: 8 # 减少worker数量以降低内存压力
    rotate_aug: True
    flip_aug: True
    scale_aug: True
    transform_aug: True
    dropout_aug: True

  val_data_loader:
    data_path: "/data/wcs2d3d/sequences/" # 你的验证数据路径
    shuffle: False
    num_workers: 8 # 减少worker数量

    # normal test
    batch_size: 12
    rotate_aug: False
    flip_aug: False
    scale_aug: False
    transform_aug: False
    dropout_aug: False

###################
## Train params
train_params:
  max_num_epochs: 250
  learning_rate: 0.18
  optimizer: SGD # [SGD, Adam]
  lr_scheduler: CosineAnnealingWarmRestarts # [StepLR, ReduceLROnPlateau, CosineAnnealingLR, CosineAnnealingWarmRestarts]
  momentum: 0.9
  nesterov: True
  weight_decay: 1.0e-4

  lambda_seg2d: 1
  lambda_xm: 0.05
  lambda_lovasz: 0.1
