# Config for UAVScenes Dataset with GAUFNet
format_version: 1

###################
## Model options
model_params:
  model_architecture: "arch_2dpass1"

  input_dims: 6  # xyz + rgb (从图像采样颜色)
  spatial_shape:
    - 2032
    - 2517
    - 2515
  scale_list:
    - 2
    - 4
    - 8
    - 16

  hiden_size: 64
  num_classes: 19  # UAVScenes: 18个有效类别 (映射后 1-18) + ignore_label (0)
  backbone_2d: resnet34
  #backbone_2d: FastSCNN
  pretrained2d: False
  use_zmap: False
  use_gata: False

###################
## Dataset options
dataset_params:
  training_size: 24126  # 根据实际数据量调整
  dataset_type: "point_image_dataset_uavscenes"
  pc_dataset_type: "UAVScenes"
  Wandb_Project: "GAUFNet_UAVScenes"
  collate_type: "collate_fn_default"
  ignore_label: 0
  label_mapping: "config/label_mapping/uavscenes.yaml"

  # 2D augmentation - UAVScenes optimal settings (95% coverage)
  # 原始图像尺寸: 2448 x 2048
  bottom_crop:
    - 480
    - 320

  color_jitter:
    - 0.4
    - 0.4
    - 0.4
  flip2d: 0.5
  image_normalizer:
    - [0.485, 0.456, 0.406]
    - [0.229, 0.224, 0.225]

  # 根据 UAVScenes 点云范围调整 (需要实际测量)
  max_volume_space:
    - 204.9
    - 131.6
    - 130.8
  min_volume_space:
    - -7.9
    - -132.1
    - -132.6

  # 19个类别的权重 (0: ignore, 1-18: 有效类别)
  seg_labelweights:
  - 0          # 0: ignore (权重为0，不参与计算)
  - 14218863   # 1: roof
  - 9312253    # 2: dirt_motor_road
  - 6573599    # 3: paved_motor_road
  - 6771821    # 4: river
  - 11925      # 5: pool
  - 56427      # 6: bridge
  - 1537139    # 7: container
  - 21447393   # 8: airstrip
  - 1535663    # 9: traffic_barrier
  - 237692751  # 10: green_field
  - 142056993  # 11: wild_field
  - 31932      # 12: solar_board
  - 47789      # 13: umbrella
  - 325720     # 14: transparent_roof
  - 839906     # 15: car_park
  - 3465631    # 16: paved_walk
  - 432508     # 17: sedan
  - 96900      # 18: truck

  train_data_loader:
    data_path: "/202221623116/zhangjun/UAVScenes"
    batch_size: 48
    shuffle: True
    num_workers: 8
    rotate_aug: True
    flip_aug: True
    scale_aug: True
    transform_aug: True
    dropout_aug: True

  val_data_loader:
    data_path: "/202221623116/zhangjun/UAVScenes"
    shuffle: False
    num_workers: 8
    batch_size: 48
    rotate_aug: False
    flip_aug: False
    scale_aug: False
    transform_aug: False
    dropout_aug: False

###################
## Train params
train_params:
  max_num_epochs: 130
  learning_rate: 0.18
  optimizer: SGD
  lr_scheduler: CosineAnnealingWarmRestarts
  momentum: 0.9
  nesterov: True
  weight_decay: 1.0e-4

  lambda_seg2d: 1
  lambda_xm: 0.05
  lambda_lovasz: 0.1
