# SantaClara / N3C-California 数据集标签映射文件
# 5 个语义类别 (含 unlabeled)
# 标签来源: ASPRS LAS Classification Codes

labels:
  0: "unlabeled"
  1: "unassigned"
  2: "ground"
  3: "low_vegetation"
  4: "medium_vegetation"
  5: "high_vegetation"
  6: "building"
  7: "low_point_noise"
  8: "model_keypoint"
  9: "water"
  10: "rail"
  11: "road_surface"
  12: "overlap_points"
  13: "wire_guard"
  14: "wire_conductor"
  15: "transmission_tower"
  16: "wire_connector"
  17: "bridge_deck"
  18: "high_noise"
  19: "overhead_structure"
  20: "ignored_ground"
  21: "snow"
  22: "temporal_exclusion"
  23: "reserved_23"
  24: "reserved_24"
  25: "reserved_25"
  26: "reserved_26"
  27: "reserved_27"
  28: "reserved_28"
  29: "reserved_29"
  30: "reserved_30"
  31: "reserved_31"

# 训练类别名称 (learning_map 映射后的类别)
mapped_labels:
  0: "unlabeled"
  1: "others"
  2: "ground"
  3: "tree"
  4: "building"

color_map: # RGB 颜色映射 (用于可视化)
  0: [0, 0, 0] # unlabeled: 黑色
  1: [128, 128, 128] # others: 灰色
  2: [139, 119, 101] # ground: 棕色
  3: [0, 128, 0] # tree: 绿色
  4: [255, 0, 0] # building: 红色

content: # 各类别点数占比 (placeholder, 请根据实际统计调整)
  0: 0.15
  1: 0.10
  2: 0.35
  3: 0.25
  4: 0.15

# ASPRS LAS Classification Codes -> 训练标签
# 参考: multisantaclara.py 中的标签重映射逻辑
learning_map:
  0: 0 # 0: Created/Never classified -> unlabeled
  1: 0 # 1: Unassigned -> unlabeled
  2: 2 # 2: Ground -> ground
  3: 1 # 3: Low Vegetation -> others
  4: 3 # 4: Medium Vegetation -> tree
  5: 3 # 5: High Vegetation -> tree
  6: 4 # 6: Building -> building
  7: 0 # 7: Low Point (Noise) -> unlabeled
  8: 0 # 8: Model Key-point -> unlabeled
  9: 1 # 9: Water -> others
  10: 0 # 10: Rail -> unlabeled
  11: 0 # 11: Road Surface -> unlabeled
  12: 0 # 12: Overlap Points -> unlabeled
  13: 0 # 13: Wire - Guard -> unlabeled
  14: 0 # 14: Wire - Conductor -> unlabeled
  15: 0 # 15: Transmission Tower -> unlabeled
  16: 0 # 16: Wire-structure Connector -> unlabeled
  17: 1 # 17: Bridge Deck -> others
  18: 0 # 18: High Noise -> unlabeled
  19: 0 # 19: Overhead Structure -> unlabeled
  20: 0 # 20: Ignored Ground -> unlabeled
  21: 0 # 21: Snow -> unlabeled
  22: 0 # 22: Temporal Exclusion -> unlabeled
  23: 0 # 23-31: Reserved -> unlabeled
  24: 0
  25: 0
  26: 0
  27: 0
  28: 0
  29: 0
  30: 0
  31: 0

# 逆映射 (训练标签 -> 原始标签, 取最具代表性的一个)
learning_map_inv:
  0: 0 # unlabeled
  1: 3 # others -> Low Vegetation
  2: 2 # ground -> Ground
  3: 5 # tree -> High Vegetation
  4: 6 # building -> Building

# 忽略类别设置
learning_ignore:
  0: True # unlabeled: 训练时忽略
  1: False # others
  2: False # ground
  3: False # tree
  4: False # building
