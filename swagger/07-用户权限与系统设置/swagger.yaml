openapi: 3.0.3
info:
  title: 用户权限与系统设置接口
  version: 0.1.0
  description: 对应用户权限管理、系统设置、系统健康与日志页面。
servers:
  - url: http://localhost:8080
tags:
  - name: IAM
  - name: Setting
  - name: System
paths:
  /api/v1/users:
    get:
      tags: [IAM]
      summary: 查询用户列表（权限管理页）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
    post:
      tags: [IAM]
      summary: 新建用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpsertRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'

  /api/v1/users/{userId}:
    patch:
      tags: [IAM]
      summary: 更新用户
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpsertRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'

  /api/v1/roles:
    get:
      tags: [IAM]
      summary: 查询角色与权限矩阵
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'

  /api/v1/settings:
    get:
      tags: [Setting]
      summary: 查询系统设置项
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingListResponse'
    patch:
      tags: [Setting]
      summary: 批量更新系统设置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/SettingItem'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'

  /api/v1/system/health:
    get:
      tags: [System]
      summary: 查询系统健康状态
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'

  /api/v1/system/logs:
    get:
      tags: [System]
      summary: 查询系统日志
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 50 }
        - in: query
          name: level
          schema: { type: string, enum: [info, warning, error] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemLogPageResponse'

components:
  schemas:
    ApiEnvelope:
      type: object
      properties:
        code: { type: string, example: "0" }
        message: { type: string, example: OK }
        traceId: { type: string, example: trace-20260526-601 }

    User:
      type: object
      properties:
        id: { type: string, example: user-001 }
        name: { type: string, example: 林澄 }
        email: { type: string, example: lincheng@hydroguardian.cn }
        roleId: { type: string, example: role-001 }
        status: { type: string, enum: [active, disabled], example: active }
    UserUpsertRequest:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        roleId: { type: string }
        status: { type: string, enum: [active, disabled] }
    UserListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/User' }
    UserDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/User'

    Role:
      type: object
      properties:
        id: { type: string, example: role-001 }
        name: { type: string, example: 系统管理员 }
        permissions:
          type: array
          items: { type: string, example: task:write }
    RoleListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Role' }

    SettingItem:
      type: object
      properties:
        key: { type: string, example: gisServiceUrl }
        value: { type: string, example: https://api.hydroguardian.cn/gis }
        category: { type: string, example: api }
        isSensitive: { type: boolean, example: false }
    SettingListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/SettingItem' }

    ServiceHealth:
      type: object
      properties:
        serviceName: { type: string, example: case-service }
        status: { type: string, enum: [up, down, degraded], example: up }
        latencyMs: { type: integer, example: 32 }
    SystemHealthResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                overallStatus: { type: string, enum: [up, down, degraded], example: up }
                services:
                  type: array
                  items: { $ref: '#/components/schemas/ServiceHealth' }

    SystemLogItem:
      type: object
      properties:
        id: { type: string, example: log-001 }
        level: { type: string, enum: [info, warning, error], example: warning }
        message: { type: string, example: agent-service 延迟超过阈值 }
        createdAt: { type: string, format: date-time }
    SystemLogPageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                page: { type: integer }
                pageSize: { type: integer }
                total: { type: integer }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/SystemLogItem' }
