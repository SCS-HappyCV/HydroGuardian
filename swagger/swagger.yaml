openapi: 3.0.3
info:
  title: HydroGuardian 前端接口总规范
  version: 1.0.0
  description: |
    按前端业务场景合并后的总 Swagger（OpenAPI 3.0）。

    ## 鉴权规范
    - 认证方式：`Bearer JWT`
    - 请求头：`Authorization: Bearer <token>`

    ## 统一返回规范
    - 成功：`code = "0"`
    - 错误：`code != "0"`
    - 所有响应包含：`code`、`message`、`traceId`

    ## 错误码规范
    - `40000` 参数错误 / 业务参数不合法
    - `40100` 未认证或 token 无效
    - `40300` 无权限访问
    - `40400` 资源不存在
    - `40900` 资源冲突（重复创建、状态冲突）
    - `42200` 校验失败（字段级错误）
    - `50000` 服务内部错误
    - `50200` 上游依赖不可用（gRPC/DB/对象存储等）
servers:
  - url: http://localhost:8080
    description: 本地开发网关
tags:
  - name: Common
    description: 公共基础数据
  - name: Dashboard
    description: 首页与全局总览
  - name: Task
    description: 任务工作坊与执行监控
  - name: Risk
    description: 风险分析区
  - name: Workorder
    description: 工单中心
  - name: History
    description: 历史回溯与对比
  - name: Knowledge
    description: 知识库与规则管理
  - name: IAM
    description: 用户与角色权限
  - name: Setting
    description: 系统设置
  - name: System
    description: 系统健康与日志
security:
  - bearerAuth: []
paths:
  /api/v1/zones:
    get:
      tags: [Common]
      summary: 获取区域列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZoneListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/task-templates:
    get:
      tags: [Common]
      summary: 获取任务模板列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskTemplateListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/samples:
    get:
      tags: [Common]
      summary: 获取样本列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SampleListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/projects:
    get:
      tags: [Common]
      summary: 获取项目列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/datasets:
    get:
      tags: [Common]
      summary: 获取数据集列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/dashboard/metrics:
    get:
      tags: [Dashboard]
      summary: 获取首页指标卡
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/dashboard/alerts:
    get:
      tags: [Dashboard]
      summary: 获取告警列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/dashboard/recent-tasks:
    get:
      tags: [Dashboard]
      summary: 获取近期任务
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecentTaskListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/dashboard/risk-distribution:
    get:
      tags: [Dashboard]
      summary: 获取风险等级分布
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskDistributionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/dashboard/risk-heatmap-preview:
    get:
      tags: [Dashboard]
      summary: 获取风险热力预览
      parameters:
        - in: query
          name: zoneId
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HeatmapPreviewResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/tasks:
    get:
      tags: [Task]
      summary: 分页查询任务列表
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20 }
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [queued, running, success, failed] }
        - in: query
          name: zoneId
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Task]
      summary: 创建任务
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/tasks/{taskId}:
    get:
      tags: [Task]
      summary: 获取任务详情
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/tasks/{taskId}/execute:
    post:
      tags: [Task]
      summary: 启动任务执行
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccess' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/tasks/{taskId}/cancel:
    post:
      tags: [Task]
      summary: 取消任务
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccess' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/tasks/{taskId}/logs:
    get:
      tags: [Task]
      summary: 查询任务执行日志（轮询）
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskLogResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/tasks/{taskId}/result:
    get:
      tags: [Task]
      summary: 获取任务结果
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResultResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/risk-events:
    get:
      tags: [Risk]
      summary: 分页查询风险事件
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20 }
        - in: query
          name: level
          schema: { type: string, enum: [low, medium, high] }
        - in: query
          name: status
          schema: { type: string, enum: [new, reviewing, closed] }
        - in: query
          name: zoneId
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskEventPageResponse' }

  /api/v1/risk-events/{eventId}:
    get:
      tags: [Risk]
      summary: 获取风险事件详情
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskEventDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/risk-events/{eventId}/status:
    patch:
      tags: [Risk]
      summary: 更新风险事件状态
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRiskStatusRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccess' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/risk-layers:
    get:
      tags: [Risk]
      summary: 获取风险图层列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskLayerListResponse' }

  /api/v1/risk-workspace/summary:
    get:
      tags: [Risk]
      summary: 获取风险工作区汇总
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskWorkspaceSummaryResponse' }

  /api/v1/workorders:
    get:
      tags: [Workorder]
      summary: 分页查询工单
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20 }
        - in: query
          name: status
          schema: { type: string, enum: [todo, doing, review, closed] }
        - in: query
          name: keyword
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkorderPageResponse' }
    post:
      tags: [Workorder]
      summary: 创建工单
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkorderRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkorderDetailResponse' }

  /api/v1/workorders/{workorderId}:
    get:
      tags: [Workorder]
      summary: 获取工单详情
      parameters:
        - in: path
          name: workorderId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkorderDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Workorder]
      summary: 更新工单状态/指派
      parameters:
        - in: path
          name: workorderId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkorderRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccess' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/workorders/{workorderId}/review:
    post:
      tags: [Workorder]
      summary: 审核工单
      parameters:
        - in: path
          name: workorderId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewWorkorderRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccess' }

  /api/v1/workorders/{workorderId}/timeline:
    get:
      tags: [Workorder]
      summary: 获取工单时间线
      parameters:
        - in: path
          name: workorderId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimelineResponse' }

  /api/v1/workorders/{workorderId}/attachments:
    post:
      tags: [Workorder]
      summary: 上传工单附件
      parameters:
        - in: path
          name: workorderId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentUploadResponse' }

  /api/v1/history/tasks:
    get:
      tags: [History]
      summary: 分页查询历史任务
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20 }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: keyword
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryTaskPageResponse' }

  /api/v1/history/tasks/{taskId}/playback:
    get:
      tags: [History]
      summary: 获取任务回放详情
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybackResponse' }

  /api/v1/history/compare:
    get:
      tags: [History]
      summary: 对比两个任务结果
      parameters:
        - in: query
          name: baseTaskId
          required: true
          schema: { type: string }
        - in: query
          name: targetTaskId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryCompareResponse' }

  /api/v1/history/risk-diff:
    get:
      tags: [History]
      summary: 获取风险差异卡片
      parameters:
        - in: query
          name: baseTaskId
          required: true
          schema: { type: string }
        - in: query
          name: targetTaskId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskDiffResponse' }

  /api/v1/rules:
    get:
      tags: [Knowledge]
      summary: 查询规则列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleListResponse' }
    post:
      tags: [Knowledge]
      summary: 新建规则
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleUpsertRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleDetailResponse' }

  /api/v1/rules/{ruleId}:
    patch:
      tags: [Knowledge]
      summary: 更新规则
      parameters:
        - in: path
          name: ruleId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleUpsertRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleDetailResponse' }
    delete:
      tags: [Knowledge]
      summary: 删除规则
      parameters:
        - in: path
          name: ruleId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccess' }

  /api/v1/templates:
    get:
      tags: [Knowledge]
      summary: 查询模板列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateListResponse' }
    post:
      tags: [Knowledge]
      summary: 新建模板
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateUpsertRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateDetailResponse' }

  /api/v1/templates/{templateId}:
    patch:
      tags: [Knowledge]
      summary: 更新模板
      parameters:
        - in: path
          name: templateId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateUpsertRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateDetailResponse' }
    delete:
      tags: [Knowledge]
      summary: 删除模板
      parameters:
        - in: path
          name: templateId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccess' }

  /api/v1/users:
    get:
      tags: [IAM]
      summary: 查询用户列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListResponse' }
    post:
      tags: [IAM]
      summary: 新建用户
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpsertRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetailResponse' }

  /api/v1/users/{userId}:
    patch:
      tags: [IAM]
      summary: 更新用户
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpsertRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetailResponse' }

  /api/v1/roles:
    get:
      tags: [IAM]
      summary: 查询角色列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleListResponse' }

  /api/v1/settings:
    get:
      tags: [Setting]
      summary: 查询系统设置
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingListResponse' }
    patch:
      tags: [Setting]
      summary: 批量更新系统设置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/SettingItem' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccess' }

  /api/v1/system/health:
    get:
      tags: [System]
      summary: 查询系统健康状态
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemHealthResponse' }

  /api/v1/system/logs:
    get:
      tags: [System]
      summary: 分页查询系统日志
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 50 }
        - in: query
          name: level
          schema: { type: string, enum: [info, warning, error] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemLogPageResponse' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            code: "40000"
            message: "Invalid request parameters"
            traceId: "trace-20260526-err-001"
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            code: "40100"
            message: "Unauthorized"
            traceId: "trace-20260526-err-002"
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            code: "40300"
            message: "Forbidden"
            traceId: "trace-20260526-err-003"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            code: "40400"
            message: "Resource not found"
            traceId: "trace-20260526-err-004"
    Conflict:
      description: 资源冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            code: "40900"
            message: "Resource conflict"
            traceId: "trace-20260526-err-005"
    ValidationFailed:
      description: 字段校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            code: "42200"
            message: "Validation failed"
            traceId: "trace-20260526-err-006"
            errors:
              - field: "priority"
                reason: "must be one of low/medium/high"
    UpstreamError:
      description: 上游依赖异常
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            code: "50200"
            message: "Upstream service unavailable"
            traceId: "trace-20260526-err-007"
    InternalError:
      description: 服务内部错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example:
            code: "50000"
            message: "Internal server error"
            traceId: "trace-20260526-err-008"

