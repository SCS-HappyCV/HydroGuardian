openapi: 3.0.3
info:
  title: 风险分析区接口
  version: 0.1.0
  description: 对应风险地图、风险列表、风险详情、图层管理等页面能力。
servers:
  - url: http://localhost:8080
tags:
  - name: Risk
paths:
  /api/v1/risk-events:
    get:
      tags: [Risk]
      summary: 查询风险事件列表
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20 }
        - in: query
          name: level
          schema: { type: string, enum: [low, medium, high] }
        - in: query
          name: status
          schema: { type: string, enum: [new, reviewing, closed] }
        - in: query
          name: zoneId
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskEventPageResponse'

  /api/v1/risk-events/{eventId}:
    get:
      tags: [Risk]
      summary: 获取风险事件详情
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskEventDetailResponse'

  /api/v1/risk-events/{eventId}/status:
    patch:
      tags: [Risk]
      summary: 更新风险事件状态
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [new, reviewing, closed]
                comment:
                  type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'

  /api/v1/risk-layers:
    get:
      tags: [Risk]
      summary: 获取风险地图图层列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskLayerListResponse'

  /api/v1/risk-workspace/summary:
    get:
      tags: [Risk]
      summary: 获取风险工作区汇总信息
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskWorkspaceSummaryResponse'

components:
  schemas:
    ApiEnvelope:
      type: object
      properties:
        code: { type: string, example: "0" }
        message: { type: string, example: OK }
        traceId: { type: string, example: trace-20260526-201 }

    RiskEvent:
      type: object
      properties:
        id: { type: string, example: risk-001 }
        title: { type: string, example: 北岸排水渠疑似堵塞 }
        level: { type: string, enum: [low, medium, high], example: high }
        status: { type: string, enum: [new, reviewing, closed], example: reviewing }
        zoneId: { type: string, example: zone-02 }
        lng: { type: number, format: double, example: 121.5051 }
        lat: { type: number, format: double, example: 31.2348 }
        updatedAt: { type: string, format: date-time }

    RiskEventPageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                page: { type: integer }
                pageSize: { type: integer }
                total: { type: integer }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/RiskEvent' }

    RiskEventDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/RiskEvent'
                - type: object
                  properties:
                    description: { type: string }
                    evidenceImages:
                      type: array
                      items: { type: string, format: uri }

    RiskLayer:
      type: object
      properties:
        id: { type: string, example: layer-001 }
        name: { type: string, example: 风险点图层 }
        visible: { type: boolean, example: true }
    RiskLayerListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/RiskLayer' }

    RiskWorkspaceSummaryResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                totalRiskEvents: { type: integer, example: 44 }
                highRiskEvents: { type: integer, example: 7 }
                activeLayers: { type: integer, example: 4 }
